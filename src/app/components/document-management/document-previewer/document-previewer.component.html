<div class="preview-container h-full flex flex-col">
    <!-- Header with document info and controls -->
    <div class="preview-header p-4 border-b bg-white flex-shrink-0">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- File icon based on type -->
                <div class="file-icon w-10 h-10 flex items-center justify-center rounded-lg" [ngClass]="{
                 'bg-blue-100': isPdfFile,
                 'bg-red-100': isWordFile,
                 'bg-green-100': isExcelFile,
                 'bg-purple-100': isTextFile
               }">
                    <i [class]="getFileIcon()"></i>
                </div>
                <!-- File info -->
                <div>
                    <h3 class="font-semibold text-gray-900">{{document.name}}</h3>
                    <span class="text-sm text-gray-500">{{getFileType()}}</span>
                </div>
            </div>
            <!-- Close button -->
            <button (click)="onClose()"
                class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Preview content -->
    <div class="preview-content flex-1 bg-gray-50 overflow-hidden">
        <!-- Excel Preview -->
        <app-excel-preview *ngIf="isExcelFile" [document]="document" class="h-full block">
        </app-excel-preview>
        <!-- PDF Preview -->
        <app-pdf-preview *ngIf="isPdfFile" [document]="document" class="h-full block">
        </app-pdf-preview>

        <!-- Text Preview -->
        <app-text-preview *ngIf="isTextFile" [document]="document" class="h-full block">
        </app-text-preview>

        <!-- Word Preview -->
        <app-word-preview *ngIf="isWordFile" [document]="document" class="h-full block">
        </app-word-preview>
    </div>
</div>
